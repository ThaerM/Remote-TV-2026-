name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: golden images (test/goldens) must be rendered by the same
          # engine they were generated with. Bump together with
          # `flutter test --update-goldens test/goldens`.
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # Native code (Kotlin/Swift platform channels) is only compiled here -
  # nothing else in the pipeline would catch a native build break.
  build-android:
    name: Android debug build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: golden images (test/goldens) must be rendered by the same
          # engine they were generated with. Bump together with
          # `flutter test --update-goldens test/goldens`.
          flutter-version: 3.47.5
          cache: true

      - name: Build debug APK
        run: flutter build apk --debug

  build-ios:
    name: iOS build (no codesign)
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: golden images (test/goldens) must be rendered by the same
          # engine they were generated with. Bump together with
          # `flutter test --update-goldens test/goldens`.
          flutter-version: 3.47.5
          cache: true

      - name: Build iOS app without code signing
        run: flutter build ios --debug --no-codesign
